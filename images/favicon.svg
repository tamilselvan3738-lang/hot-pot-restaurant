<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="favSpicyBroth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E74C3C"/>
      <stop offset="60%" stop-color="#C0392B"/>
      <stop offset="100%" stop-color="#7B241C"/>
    </linearGradient>
    <linearGradient id="favHerbalBroth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="50%" stop-color="#F39C12"/>
      <stop offset="100%" stop-color="#B7950B"/>
    </linearGradient>
    <linearGradient id="favGoldPot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9E6"/>
      <stop offset="35%" stop-color="#F5B041"/>
      <stop offset="70%" stop-color="#D4AC0D"/>
      <stop offset="100%" stop-color="#7D6608"/>
    </linearGradient>
    <linearGradient id="favPotBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#56150F"/>
      <stop offset="60%" stop-color="#3A0D08"/>
      <stop offset="100%" stop-color="#1E0704"/>
    </linearGradient>
    <linearGradient id="favSteamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F5B041" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#FFF3E0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFF3E0" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="favBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#30110B"/>
      <stop offset="80%" stop-color="#180604"/>
      <stop offset="100%" stop-color="#0E0302"/>
    </radialGradient>
  </defs>

  <!-- Circular Badge Background -->
  <circle cx="32" cy="32" r="30" fill="url(#favBgGrad)" stroke="url(#favGoldPot)" stroke-width="2"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="rgba(245, 176, 65, 0.3)" stroke-width="0.75" stroke-dasharray="3, 2"/>

  <!-- Rising Steam Swirls -->
  <g fill="none" stroke="url(#favSteamGrad)" stroke-width="2" stroke-linecap="round">
    <path d="M25 21C23 16 27 12 25 7" />
    <path d="M32 19C34 14 30 10 33 5" />
    <path d="M39 21C41 16 37 12 39 7" />
  </g>

  <!-- Hot Pot Handles -->
  <path d="M12 36C10 36 8 38 8 40C8 42 10 44 12 44" stroke="url(#favGoldPot)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M52 36C54 36 56 38 56 40C56 42 54 44 52 44" stroke="url(#favGoldPot)" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Pot Outer Body -->
  <path d="M14 34C14 46 22 53 32 53C42 53 50 46 50 34H14Z" fill="url(#favPotBody)" stroke="url(#favGoldPot)" stroke-width="1.8"/>

  <!-- Divided Yin-Yang Broth Surface -->
  <ellipse cx="32" cy="34" rx="18" ry="8" fill="#1A0A08" stroke="url(#favGoldPot)" stroke-width="2"/>
  <path d="M14 34C14 38.4 22 42 32 42C32 38 28 34 32 30C22 30 14 31.8 14 34Z" fill="url(#favSpicyBroth)"/>
  <path d="M50 34C50 38.4 42 42 32 42C32 38 36 34 32 30C42 30 50 31.8 50 34Z" fill="url(#favHerbalBroth)"/>
  <path d="M32 26C30 30 34 34 32 42" stroke="url(#favGoldPot)" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Broth Bubbles & Ingredients -->
  <circle cx="22" cy="36" r="1.5" fill="#FF5722"/>
  <circle cx="26" cy="38" r="1.1" fill="#FFA000"/>
  <circle cx="42" cy="36" r="1.4" fill="#FFE082"/>
  <circle cx="38" cy="34" r="1.1" fill="#C0392B"/>
</svg>
